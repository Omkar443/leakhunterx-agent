[build-system]
requires = ["setuptools>=61.0"]
build-backend = "setuptools.build_meta"

[project]
name = "leakhunterx-agent"
version = "1.1.0rc10"
description = "LeakHunterX Security Scanning Agent"
readme = "README.md"
requires-python = ">=3.10"
license = { text = "MIT" }
authors = [{ name = "LeakHunterX" }]
keywords = ["security", "scanner", "secrets", "leak-detection", "leakhunterx"]
classifiers = [
  "Development Status :: 4 - Beta",
  "Environment :: Console",
  "Intended Audience :: Developers",
  "License :: OSI Approved :: MIT License",
  "Operating System :: Microsoft :: Windows",
  "Operating System :: POSIX :: Linux",
  "Operating System :: MacOS",
  "Programming Language :: Python :: 3",
  "Topic :: Security",
]

dependencies = [
  "certifi==2026.7.22",
  "httpx==0.28.1",
  "aiohttp==3.14.5",
  "beautifulsoup4==4.15.0",
  "psutil==7.2.2",
  "cryptography==50.0.2",
  "playwright==1.63.0",
]

[project.optional-dependencies]
browser = [] # Compatibility: rendering is now included in the base installation.

[project.urls]
Homepage = "https://leakhunterx.com"
Download = "https://pypi.org/project/leakhunterx-agent/"
Documentation = "https://github.com/Omkar443/leakhunterx-agent#documentation"
Issues = "https://github.com/Omkar443/leakhunterx-agent/issues"
Source = "https://github.com/Omkar443/leakhunterx-agent"

# Canonical CLI plus the compatibility entry point for existing installations.
[project.scripts]
lhx = "agent.cli:canonical_run"
lhx-agent = "agent.cli:run"

# src-layout package discovery
[tool.setuptools]
package-dir = { "" = "src" }

[tool.setuptools.packages.find]
where = ["src"]
include = ["agent*"]
exclude = [
  "dlq",
  "dlq.*",
  "node_modules",
  "node_modules.*",
  "tests",
  "tests.*",
]
