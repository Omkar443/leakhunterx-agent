[build-system]
requires = ["setuptools>=61.0"]
build-backend = "setuptools.build_meta"

[project]
name = "lhx-agent"
version = "1.0.0"
description = "LeakHunterX Security Scanning Agent"
readme = "README.md"
requires-python = ">=3.9"
license = { text = "MIT" }
authors = [{ name = "LeakHunterX" }]
keywords = ["security", "scanner", "secrets", "leak-detection", "leakhunterx"]
classifiers = [
  "Development Status :: 4 - Beta",
  "Environment :: Console",
  "Intended Audience :: Developers",
  "License :: OSI Approved :: MIT License",
  "Operating System :: Microsoft :: Windows",
  "Operating System :: POSIX :: Linux",
  "Operating System :: MacOS",
  "Programming Language :: Python :: 3",
  "Topic :: Security",
]

dependencies = [
  "httpx",
  "aiohttp",
  "beautifulsoup4",
  "psutil",
  "cryptography>=50.0.2,<51",
]

[project.optional-dependencies]
browser = ["playwright>=1.55,<2"]

[project.urls]
Homepage = "https://leakhunterx.com"
Download = "https://download.leakhunterx.com"
Source = "https://github.com/Omkar443/leakhunterx-agent"

# CLI entry point -> `lhx-agent` on PATH after `pip install lhx-agent`
[project.scripts]
lhx-agent = "agent.cli:run"

# src-layout package discovery
[tool.setuptools]
package-dir = { "" = "src" }

[tool.setuptools.packages.find]
where = ["src"]
include = ["agent*"]
exclude = [
  "dlq",
  "dlq.*",
  "node_modules",
  "node_modules.*",
  "tests",
  "tests.*",
]
