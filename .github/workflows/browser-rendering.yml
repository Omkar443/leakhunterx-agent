name: Browser rendering regression
on:
  pull_request:
  push:
    branches: [dev]
permissions:
  contents: read
jobs:
  browser:
    runs-on: ubuntu-22.04
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      - run: python -m pip install . pytest
      - run: python -m playwright install --with-deps --only-shell chromium
      - run: python -m pytest tests/test_browser_rendering.py -q
        env:
          LHX_TEST_BROWSER: '1'
          PYTHONPATH: src

  bundled-agent:
    name: Bundled runtime (${{ matrix.label }})
    runs-on: ${{ matrix.os }}
    timeout-minutes: 20
    strategy:
      fail-fast: false
      matrix:
        include:
          - os: ubuntu-22.04
            label: linux-x64
            binary: dist/lhx-agent-linux-x64
          - os: windows-latest
            label: windows-x64
            binary: dist/lhx-agent-windows-x64.exe
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - run: python -m pip install . pyinstaller
      - name: Linux browser system dependencies
        if: runner.os == 'Linux'
        run: python -m playwright install-deps chromium
      - run: python packaging/build.py
      - run: python packaging/browser_smoke.py "${{ matrix.binary }}"
      - uses: actions/upload-artifact@v4
        with:
          name: lhx-agent-bundled-${{ matrix.label }}
          path: ${{ matrix.binary }}
          retention-days: 7
