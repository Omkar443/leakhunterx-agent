name: Release

# Builds the standalone binaries for Windows and Linux, attaches them to the
# GitHub release/PyPI only for a stable tag whose acceptance gate passes.
# Main pushes do not publish; manual and candidate builds are artifacts only.
on:
  push:
    tags:
      - "v*"
  workflow_dispatch:

permissions:
  contents: read

jobs:
  verify:
    name: Verify candidate and release gates
    runs-on: ubuntu-latest
    outputs:
      stable: ${{ steps.gates.outputs.stable }}
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - run: python -m pip install -e . pytest
      - run: python -m pip check
      - name: Verify Python distributions and installed CLI
        run: |
          python -m pip install build twine
          python -m build
          python -m twine check dist/*.whl dist/*.tar.gz
          python -m venv /tmp/lhx-wheel
          /tmp/lhx-wheel/bin/python -m pip install dist/*.whl
          /tmp/lhx-wheel/bin/python -m pip check
          cd /tmp
          /tmp/lhx-wheel/bin/lhx --version
          /tmp/lhx-wheel/bin/lhx service --help
          /tmp/lhx-wheel/bin/lhx-agent --help
      - run: python -m pytest tests -q
      - run: python benchmarks/run.py --check --output benchmarks/results/release.json
      - run: python benchmarks/run.py --external --check --output benchmarks/results/release-external.json
      - name: Validate release tag and acceptance
        id: gates
        env:
          RELEASE_REF: ${{ github.ref }}
        run: python packaging/check_release.py

  binaries:
    name: Binary (${{ matrix.label }})
    runs-on: ${{ matrix.os }}
    needs: verify
    permissions:
      contents: write
    strategy:
      fail-fast: false
      matrix:
        include:
          - os: ubuntu-22.04
            label: linux-x64
            spec: packaging/lhx-agent-linux-x64.spec
            artifact: dist/lhx-agent-linux-x64
          - os: windows-latest
            label: windows-x64
            spec: packaging/lhx-agent-windows-x64.spec
            artifact: dist/lhx-agent-windows-x64.exe
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          python -m pip install . pyinstaller aiohttp

      - name: Install Linux browser system libraries for smoke tests
        if: runner.os == 'Linux'
        run: python -m playwright install-deps chromium

      - name: Build
        run: python packaging/build.py

      - name: Smoke test
        shell: bash
        run: |
          if [ "${{ runner.os }}" = "Linux" ]; then chmod +x "${{ matrix.artifact }}"; fi
          "${{ matrix.artifact }}" --help
          "${{ matrix.artifact }}" --version
          "${{ matrix.artifact }}" status --help
          python packaging/browser_smoke.py "${{ matrix.artifact }}"

      - uses: actions/upload-artifact@v4
        with:
          name: lhx-agent-${{ matrix.label }}
          path: ${{ matrix.artifact }}

      # install.sh fetches lhx-agent.png from the release to register the
      # Linux desktop icon, so it is attached alongside the ELF binary.
      - name: Attach to release
        if: needs.verify.outputs.stable == 'true'
        uses: softprops/action-gh-release@v2
        with:
          files: |
            ${{ matrix.artifact }}
            ${{ matrix.label == 'linux-x64' && 'assets/lhx-agent.png' || '' }}

  pypi:
    name: Publish to PyPI
    if: needs.verify.outputs.stable == 'true'
    needs: [verify, binaries]
    runs-on: ubuntu-latest
    environment: pypi
    permissions:
      id-token: write
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Build wheel and sdist
        run: |
          python -m pip install --upgrade pip build
          python -m build

      - name: Publish
        uses: pypa/gh-action-pypi-publish@release/v1
