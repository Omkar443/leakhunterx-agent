<svg xmlns="http://www.w3.org/2000/svg" width="1280" height="736" viewBox="0 0 1280 736" role="img" aria-labelledby="title description">
  <title id="title">LeakHunterX architecture: local acquisition and detection, cloud validation and review</title>
  <desc id="description">Local projects, authorized GitHub repositories, live websites and assigned archive snapshots feed the local agent. Scoped acquisition, detection and context extraction, then a sanitized durable outbox deliver evidence to authenticated backend ingestion, contextual validation, Delta and exposure correlation, and dashboard reports. The workspace sends authorized assignments to the agent; private source stays local.</desc>
  <defs>
    <marker id="arrow" markerWidth="8" markerHeight="8" refX="7" refY="4" orient="auto" markerUnits="userSpaceOnUse"><path d="M1 1L7 4L1 7" fill="none" stroke="#617686" stroke-width="1.5"/></marker>
  </defs>
  <rect x=".5" y=".5" width="1279" height="735" rx="16" fill="#f8fafc" stroke="#cbd5df"/>
  <g font-family="Arial, Helvetica, sans-serif">
    <text x="40" y="43" fill="#16252e" font-size="20" font-weight="700">From source to security insight.</text>
    <text x="1240" y="42" text-anchor="end" fill="#526776" font-size="13" letter-spacing="1.2">LEAKHUNTERX / SYSTEM ARCHITECTURE</text>
    <g fill="#ffffff" stroke="#bdcbd5">
      <rect x="40" y="72" width="282" height="88" rx="10"/>
      <rect x="346" y="72" width="282" height="88" rx="10"/>
      <rect x="652" y="72" width="282" height="88" rx="10"/>
      <rect x="958" y="72" width="282" height="88" rx="10"/>
    </g>
    <g fill="#172832" font-size="20" font-weight="700">
      <text x="61" y="106">Local project</text><text x="367" y="106">GitHub repository</text>
      <text x="673" y="106">Live website</text><text x="979" y="106">Historical web</text>
    </g>
    <g fill="#526776" font-size="16">
      <text x="61" y="135">Registered filesystem root</text><text x="367" y="135">Authorized, pinned commit</text>
      <text x="673" y="135">HTTP + headless browser</text><text x="979" y="135">Assigned archive snapshots</text>
    </g>
    <path d="M181 160V189H1099V160M487 160V189M793 160V189M181 189V218" fill="none" stroke="#617686" stroke-width="1.5" marker-end="url(#arrow)"/>
    <rect x="24" y="218" width="1232" height="204" rx="12" fill="#1c272e"/>
    <text x="48" y="252" fill="#f3f7fa" font-size="14" letter-spacing="1.4">LOCAL AGENT / USER MACHINE</text>
    <text x="1232" y="252" text-anchor="end" fill="#bccbd5" font-size="15">Private source stays local</text>
    <g fill="#26343d" stroke="#657d8d">
      <rect x="48" y="275" width="350" height="115" rx="9"/>
      <rect x="465" y="275" width="350" height="115" rx="9"/>
      <rect x="882" y="275" width="350" height="115" rx="9"/>
    </g>
    <g fill="#f3f7fa" font-size="21" font-weight="700">
      <text x="69" y="307">Scoped acquisition</text>
      <text x="486" y="307">Detection + context</text>
      <text x="903" y="307">Sanitized durable outbox</text>
    </g>
    <g fill="#c7d4dd" font-size="17">
      <text x="69" y="338">Consent · Ignore rules</text><text x="69" y="365">Scope and resource budgets</text>
      <text x="486" y="338">Secret patterns · Endpoints</text><text x="486" y="365">Evidence and source provenance</text>
      <text x="903" y="338">Redaction · Stable event IDs</text><text x="903" y="365">Ordered delivery and replay</text>
    </g>
    <g fill="none" stroke="#a4bac9" stroke-width="1.7">
      <path d="M405 332H455M449 327L455 332L449 337"/>
      <path d="M822 332H872M866 327L872 332L866 337"/>
    </g>
    <path d="M1057 422V463H168V491" fill="none" stroke="#617686" stroke-width="1.5" marker-end="url(#arrow)"/>
    <rect x="727" y="445" width="267" height="32" rx="16" fill="#f8fafc"/>
    <text x="861" y="467" text-anchor="middle" fill="#365467" font-size="15">Bounded, sanitized evidence</text>
    <rect x="24" y="491" width="1232" height="167" rx="12" fill="#eaf3ef" stroke="#91b5a5"/>
    <text x="48" y="525" fill="#173e32" font-size="14" letter-spacing="1.4">BACKEND / TENANT WORKSPACE</text>
    <text x="1232" y="525" text-anchor="end" fill="#426c5d" font-size="15">Workspace access and coordination</text>
    <g fill="#ffffff" stroke="#91b5a5">
      <rect x="48" y="546" width="240" height="85" rx="9"/>
      <rect x="363" y="546" width="240" height="85" rx="9"/>
      <rect x="678" y="546" width="240" height="85" rx="9"/>
      <rect x="993" y="546" width="239" height="85" rx="9"/>
    </g>
    <g fill="#173e32" font-size="18" font-weight="700">
      <text x="65" y="575">Authenticated ingestion</text><text x="380" y="575">Contextual validation</text>
      <text x="695" y="575">Delta + exposure</text><text x="1010" y="575">Review + reporting</text>
    </g>
    <g fill="#426c5d" font-size="15">
      <text x="65" y="604">Access · Evidence persistence</text><text x="380" y="604">AI assessment when available</text>
      <text x="695" y="604">Scope and coverage-aware</text><text x="1010" y="604">Dashboard · Findings · Reports</text>
    </g>
    <g fill="none" stroke="#617686" stroke-width="1.5" marker-end="url(#arrow)">
      <path d="M298 589H353"/><path d="M613 589H668"/><path d="M928 589H983"/>
    </g>
    <path d="M1128 658V690H12V332H48" fill="none" stroke="#617686" stroke-width="1.5" stroke-dasharray="5 5" marker-end="url(#arrow)"/>
    <rect x="356" y="674" width="658" height="32" rx="16" fill="#f8fafc"/>
    <text x="685" y="696" text-anchor="middle" fill="#365467" font-size="16">Workspace → Agent: authorized assignments and scan control</text>
  </g>
</svg>
